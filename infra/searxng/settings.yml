use_default_settings: true

general:
  debug: false
  instance_name: Local AI Research Search

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  limiter: false
  secret_key: local-only-no-public-ingress

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0